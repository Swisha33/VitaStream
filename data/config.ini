# VitaStream Einstellungen (wird von der App ueberschrieben, wenn du dort etwas aenderst)
# adblock: lokale Blockliste (blocklist.txt) fuer alle Anfragen der App
adblock=1
# custom_dns: Namen ueber eigenen DNS aufloesen (Standard: AdGuard DNS, filtert Werbung/Tracker)
custom_dns=1
dns_primary=94.140.14.14
dns_secondary=94.140.15.15
timeout=20
# HTTPS-Zertifikate pruefen (Systemzertifikate der Vita, optional cacert.pem)
ssl_verify=1
