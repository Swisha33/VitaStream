name: Build VPK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.4 bauen
        run: |
          git clone --depth 1 -b v5.4.6 https://github.com/lua/lua tests/lua
          make -C tests/lua -s CFLAGS="-O2 -DLUA_USE_LINUX" MYLIBS="-ldl"
      - name: Tests (Blockliste, DNS, Plugins)
        run: LUA_SRC=./lua tests/run_tests.sh

  vita:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Bauen
        run: ci/vita-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VitaStream-vpk
          path: build/VitaStream.vpk

  # Bei jedem Push auf main: VPK als Release "nightly" veroeffentlichen (direkter Download-Link)
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [vita, host-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VitaStream-vpk
      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly VitaStream.vpk --prerelease --target "$GITHUB_SHA" \
            --title "VitaStream (aktueller Build)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. VPK mit VitaShell installieren."
